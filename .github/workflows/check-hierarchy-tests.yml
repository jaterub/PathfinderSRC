name: Verify canonical hierarchy and closure guards
on:
  pull_request:
    paths:
      - CONTEXTO.md
      - .github/canonical-check.json
      - agentic-loop/tools/**
      - agentic-loop/tests/**
      - .github/workflows/**
  push:
    paths:
      - CONTEXTO.md
      - .github/canonical-check.json
      - agentic-loop/tools/**
      - agentic-loop/tests/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test canonical check and synchronization offline
        run: |
          python -m compileall -q agentic-loop/tools
          python -m unittest discover -s agentic-loop/tests -p "test_blueprint*.py" -v
          python -m unittest discover -s agentic-loop/tests -p "test_guard_issue_closure.py" -v
          python -m unittest discover -s agentic-loop/tests -p "test_canonical_sync.py" -v
