name: Privacidad de la demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechazar clientes privados y comprobar el CV publico
        run: python -m unittest discover -s pruebas -p 'test_*.py' -v
