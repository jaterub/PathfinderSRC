name: Pruebas y privacidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacidad:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pathfinder
          POSTGRES_DB: pathfinder_test
          POSTGRES_PASSWORD: pathfinder_ci_test_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pathfinder -d pathfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.7"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          PATHFINDER_TEST_DB: "1"
          POSTGRES_PASSWORD: pathfinder_ci_test_only
        run: uv run --locked python -m pytest pruebas -v
