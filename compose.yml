services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_DB: pathfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
